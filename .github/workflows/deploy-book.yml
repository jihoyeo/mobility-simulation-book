name: deploy-book

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # DTUMOS 서버에 붙지 않는다. 모든 엔진 호출은 data/fixtures/ 의 녹화본으로 대체된다.
      SMARTMOB_OFFLINE: "1"
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 한글 폰트 설치
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-nanum
          fc-cache -fv

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 실행 캐시 복원
        uses: actions/cache@v4
        with:
          path: _build/.jupyter_cache
          key: jcache-${{ hashFiles('ko/**/*.md', 'smartmob/**/*.py', 'data/fixtures/**') }}
          restore-keys: jcache-

      - name: 책 빌드
        run: jupyter-book build . --warningiserror --keep-going

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
