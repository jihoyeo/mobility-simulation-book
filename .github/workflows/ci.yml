name: ci

on:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      SMARTMOB_OFFLINE: "1"
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 한글 폰트 설치
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-nanum
          fc-cache -fv

      - name: 의존성 설치
        run: pip install -r requirements.txt pytest

      - name: 테스트
        run: pytest -m "not live"

      - name: 책 빌드 (배포 없음)
        run: jupyter-book build . --warningiserror --keep-going

  style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 문체 검사
        run: python tools/kolint.py ko/ intro.md README.md
