<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 470" role="img" aria-labelledby="title desc">
  <title id="title">경로 계산에서 수단별 수요까지</title>
  <desc id="desc">같은 출발지와 목적지의 택시, 버스, 버스와 지하철 경로를 구합니다. 시간과 요금에 선호 계수를 곱해 효용을 계산하고, 지수값을 정규화해 선택확률을 구한 뒤 사람별 대안을 추출합니다.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#66798c"/></marker></defs>
  <style>
    text{font-family:"Noto Sans KR","Apple SD Gothic Neo",sans-serif;fill:#20344d;font-size:18px}
    .heading{font-size:23px;font-weight:700}.small{font-size:16px;fill:#52677e}
    .arrow{fill:none;stroke:#66798c;stroke-width:2;marker-end:url(#arrow)}
  </style>
  <rect width="1060" height="470" rx="12" fill="#f8fafc"/>
  <text x="30" y="40" class="heading">한 통행의 대안을 만들고, 사람의 선택을 확률로 계산합니다.</text>
  <rect x="30" y="85" width="270" height="235" rx="10" fill="#eff6ff" stroke="#a9bfdc"/>
  <text x="48" y="116" class="heading">① 경로 속성</text>
  <text x="48" y="150">같은 출발지·목적지·시각</text>
  <text x="48" y="187">택시 → 도로 경로 + 요금</text>
  <text x="48" y="222">대중교통 → RAPTOR + 요금</text>
  <text x="48" y="266" class="small">차내·대기·도보: 분</text>
  <text x="48" y="293" class="small">요금: 천 원 / 환승: 회</text>
  <path class="arrow" d="M302 207H342"/>
  <rect x="345" y="85" width="300" height="235" rx="10" fill="white" stroke="#bdc9d5"/>
  <text x="365" y="116" class="heading">② 효용 V</text>
  <text x="365" y="155">상수 + Σ(계수 × 속성)</text>
  <text x="365" y="199">택시                   −3.050</text>
  <text x="365" y="234">버스 직통            −2.850</text>
  <text x="365" y="269">버스+지하철        −3.165</text>
  <text x="365" y="300" class="small">값이 클수록 선호하는 대안</text>
  <path class="arrow" d="M647 207H687"/>
  <rect x="690" y="85" width="340" height="235" rx="10" fill="#edf9f5" stroke="#96c6b7"/>
  <text x="710" y="116" class="heading">③ 선택확률 P</text>
  <text x="710" y="155">exp(V) ÷ 모든 대안의 exp(V) 합</text>
  <text x="710" y="199">택시                       32.1%</text>
  <text x="710" y="234">버스 직통                39.2%</text>
  <text x="710" y="269">버스+지하철            28.6%</text>
  <text x="710" y="300" class="small">반올림 전 확률의 합 = 100%</text>
  <rect x="345" y="354" width="300" height="78" rx="10" fill="#fff7e8" stroke="#d9c18f"/>
  <text x="365" y="383">선호에 대한 가정 또는 추정</text>
  <text x="365" y="411" class="small">계수 β · 대안별 상수 ASC</text>
  <path class="arrow" d="M495 354V322"/>
  <path class="arrow" d="M860 322V352"/>
  <rect x="690" y="354" width="340" height="78" rx="10" fill="white" stroke="#bdc9d5"/>
  <text x="710" y="383">확률에 따라 대안 하나 추출</text>
  <text x="710" y="411" class="small">사람별로 반복 → 수단별 통행 목록</text>
  <text x="30" y="377" class="small">숫자는 본문의 설명용 예제입니다.</text>
  <text x="30" y="406" class="small">계수 추정은 별도의 관측 자료가 필요합니다.</text>
</svg>
