<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" role="img" aria-labelledby="title desc">
  <title id="title">다익스트라와 RAPTOR가 다음 조사 대상을 고르는 방법</title>
  <desc id="desc">다익스트라는 현재 비용이 가장 작은 노드 하나를 고르고 그 이웃을 조사합니다. RAPTOR는 직전 라운드에서 더 일찍 도착한 정류장을 고르고 그 정류장을 지나는 운행 패턴의 시간표를 조사합니다.</desc>
  <style>
    text{font-family:"Noto Sans KR","Apple SD Gothic Neo",sans-serif;fill:#20344d}
    .title{font-size:26px;font-weight:700}
    .head{font-size:23px;font-weight:700}
    .step{font-size:19px;font-weight:700}
    .detail{font-size:17px;fill:#425a70}
    .note{font-size:17px;fill:#425a70}
    .arrow{fill:none;stroke:#71889d;stroke-width:2.5;marker-end:url(#arrow)}
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#71889d"/>
    </marker>
  </defs>
  <rect width="1000" height="430" fill="white"/>
  <text x="28" y="40" class="title">다음에 무엇을 조사할까?</text>
  <rect x="25" y="66" width="460" height="312" rx="12" fill="#f3f8fe" stroke="#b7cee2"/>
  <rect x="515" y="66" width="460" height="312" rx="12" fill="#fff8ee" stroke="#e3c9a3"/>
  <text x="48" y="104" class="head">다익스트라: 노드 하나</text>
  <text x="538" y="104" class="head">RAPTOR: 개선된 정류장</text>
  <rect x="48" y="124" width="414" height="86" rx="8" fill="white" stroke="#b7cee2"/>
  <text x="68" y="158" class="step">① 현재 비용이 가장 작은 노드 선택</text>
  <text x="68" y="187" class="detail">예: B까지 10분이면 B를 꺼냄</text>
  <rect x="538" y="124" width="414" height="86" rx="8" fill="white" stroke="#e3c9a3"/>
  <text x="558" y="158" class="step">① 더 일찍 도착한 정류장 선택</text>
  <text x="558" y="187" class="detail">예: 라운드 1에서 B가 08:10으로 개선</text>
  <path class="arrow" d="M255 211V239"/>
  <path class="arrow" d="M745 211V239"/>
  <rect x="48" y="242" width="414" height="100" rx="8" fill="white" stroke="#b7cee2"/>
  <text x="68" y="278" class="step">② B와 연결된 이웃 조사</text>
  <text x="68" y="310" class="detail">이동 비용을 더해 도착값 비교</text>
  <rect x="538" y="242" width="414" height="100" rx="8" fill="white" stroke="#e3c9a3"/>
  <text x="558" y="278" class="step">② B를 지나는 패턴 조사</text>
  <text x="558" y="310" class="detail">탈 차를 고르고 도착시각 비교</text>
  <text x="500" y="411" text-anchor="middle" class="note">둘 다 더 좋은 도착값을 기록하지만, 조사할 대상을 고르는 방식이 다릅니다.</text>
</svg>
