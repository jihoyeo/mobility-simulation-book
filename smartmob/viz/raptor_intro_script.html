<script>
// Explanatory scenes through convergence, from the same toy feed as the notebook.
const INTRO=DATA.intro;
let basicsRun=0,basicsStep=0,basicsAnswer=null;
const basicsLabels=['출발','첫 차','같은 차','도보','한 번의 한계','두 번째 차','두 번의 결과','라운드 3','종료 확인'];
const basicsTime=t=>t===null?'—':t%60===0?shortClock(t):clock(t);
function basicsDescription(){
 const r=INTRO.runs[basicsRun],first=r.scenes[1],walk=r.scenes[3],late=basicsRun===1;
 const rail=INTRO.patterns[1],railDeparture=rail.departures[0][0],railArrival=rail.arrivals[0][1];
 return [
  {title:`${shortClock(r.departure)}, A에 서 있습니다.`,copy:'아직 차를 타지 않았습니다. A에는 이미 있고, 다른 정류장으로 가는 경로는 아직 찾지 못했습니다. 이 출발 상태를 라운드 0이라고 부릅니다.',equation:`0번 탑승: A = ${shortClock(r.departure)} · B, C, D, E = —`},
  {title:late?'08:00 차를 놓쳐, 08:30 차를 고릅니다.':'08:00에 출발하는 1호선을 탈 수 있습니다.',copy:late?'A에 온 시각은 08:05입니다. 이미 떠난 08:00 차는 탈 수 없으므로 다음 08:30 차까지 기다립니다.':'승객이 준비된 시각과 차량 출발시각을 비교합니다. 이 예제에서는 출발시각과 동시에 정류장에 도착해도 탑승할 수 있습니다.',equation:`A 도착 ${shortClock(r.departure)} ≤ 차 출발 ${shortClock(first.departure)} · 대기 ${(first.departure-r.departure)/60}분`},
  {title:'B도 C도, 같은 차로 가면 한 번 탑승입니다.',copy:'선택한 시간표 행을 오른쪽으로 읽습니다. B에서 내리는 경로와 C까지 가는 경로를 모두 기록합니다. 정류장을 두 구간 지나도 차는 한 번만 탔습니다.',equation:`1번 탑승: B = ${basicsTime(r.rounds[1][1])} · C = ${basicsTime(r.rounds[1][2])}`},
  {title:'B에서 D까지 걸어도 탑승은 늘지 않습니다.',copy:'B에서 내린 뒤 110초를 걸으면 D에 도착합니다. 걷는 동안 새 차를 타지 않았으므로 D의 도착시각도 라운드 1에 적습니다.',equation:`B ${basicsTime(r.rounds[1][1])} + 도보 1분 50초 = D ${basicsTime(walk.arrival)}`},
  {title:'D까지 왔지만, E는 아직 빈칸입니다.',copy:'라운드 1에서는 차량 탑승을 한 번까지만 허용합니다. A에서 1호선을 이미 탔으므로 D에서 2호선에 타는 경로는 다음 라운드에서 계산해야 합니다.',equation:'A → B: 첫 탑승 / B ⇢ D: 도보 / D → E: 두 번째 탑승'},
  {title:'이제 두 번까지 타는 경로를 허용합니다.',copy:late?'라운드 1의 답을 가져옵니다. D에 08:41:50 도착하므로 08:15 차는 이미 떠났습니다. 2호선은 이 시간표에 한 편뿐입니다.':'라운드 1의 답을 가져옵니다. D에 08:11:50 도착할 수 있다는 기록으로 08:15 차를 고릅니다. 3분 10초 기다린 뒤 두 번째 탑승을 할 수 있습니다.',equation:`D 도착 ${basicsTime(walk.arrival)} ${late?'>':'≤'} 차 출발 ${shortClock(railDeparture)} → ${late?'탑승 불가':'탑승 가능'}`},
  {title:late?'출발을 5분 늦추면 E에 갈 수 없습니다.':'두 번 탑승을 허용하자 E에 08:25를 적습니다.',copy:late?'C는 두 번째 1호선으로 08:50에 도착합니다. 하지만 D에서 탈 2호선은 없습니다. 새로 개선된 도착시각이 없어 계산을 끝냅니다.':'E에는 2호선 도착시각을 기록합니다. C에는 한 번만 타고도 08:20에 갈 수 있으므로 그 답을 유지합니다. 두 번까지 탈 수 있다는 뜻이지, 꼭 두 번 타야 한다는 뜻은 아닙니다.',equation:late?'C = 08:50 · E = 미도달':`E = ${shortClock(railArrival)} · 두 번 탑승 = 환승 한 번`},
  {title:'라운드 3: 세 번까지 타는 경로를 확인합니다.',copy:'라운드 2의 도착시각을 이전 답으로 가져옵니다. 직전에 개선된 정류장은 E뿐이므로 E를 지나는 2호선을 다시 확인합니다. E는 이 운행의 마지막 정류장이라 더 이동할 곳이 없습니다.',equation:'prev ← 라운드 2의 답 · cur ← prev 복사 · 이번에 확인: E의 2호선'},
  {title:'라운드 3에서도 더 빨라지는 값이 없어 종료합니다.',copy:'세 번까지 탑승을 허용했지만 모든 정류장의 도착시각이 라운드 2와 같습니다. 개선된 정류장이 없으므로 다음 라운드를 시작하지 않습니다. E까지의 최선 경로는 두 번 탑승하는 경로로 남습니다.',equation:'라운드 3 = 라운드 2 · 개선 0개 · E = 08:25 유지'},
 ][basicsStep];
}
function renderBasics(){
 const r=INTRO.runs[basicsRun],s=r.scenes[basicsStep],before=basicsStep?r.scenes[basicsStep-1].times:INTRO.stops.map(()=>null),d=basicsDescription();
 const changed=INTRO.stops.map((_,i)=>i).filter(i=>isImproved(s.times,before,i));
 $('basics-title').textContent=d.title;$('basics-copy').textContent=d.copy;$('basics-equation').textContent=d.equation;
 $('basics-kicker').textContent=`라운드 ${s.round} · ${s.round===0?'차량 탑승 전':`최대 ${s.round}번 탑승`}`;
 const finished=basicsStep===r.scenes.length-1;
 $('basics-progress').textContent=`${basicsStep+1} / ${r.scenes.length} 단계`;
 $('basics-steps').innerHTML=r.scenes.map((scene,i)=>{const label=basicsRun===1&&i===6?'종료 확인':basicsLabels[i];return `<button data-basics-step="${i}" aria-current="${i===basicsStep?'step':'false'}" aria-label="${i+1}단계, 라운드 ${scene.round}: ${label}">${label}</button>`;}).join('');
 $('basics-prev').disabled=basicsStep===0;$('basics-next').disabled=finished;
 $('basics-next').textContent=finished?`${r.scenes.length}단계 완료`:['첫 차 고르기 →','같은 차로 이동 →','D까지 걷기 →','한 번의 한계 →','두 번 허용하기 →','두 번의 결과 →','세 번 허용하기 →','종료 확인하기 →'][basicsStep];
 document.querySelectorAll('[data-basics-run]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.basicsRun===basicsRun)));
 $('basics-check').hidden=basicsStep!==4;
 document.querySelectorAll('[data-basics-answer]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.basicsAnswer===basicsAnswer)));
 $('basics-feedback').textContent=basicsAnswer===null?'답을 골라 이유를 확인해 보세요.':basicsAnswer==='unreached'?'맞습니다. D까지 걸어가도 탑승은 한 번입니다. E에 가려면 두 번째 차량을 검토해야 합니다.':'08:25는 08:00 출발 때 두 번 탑승해서 얻는 답입니다. 지금은 한 번만 허용하므로 E는 아직 빈칸입니다.';
 renderBasicsDiagram(s,changed);renderBasicsTimetable(r);
 $('basics-update').textContent=changed.length?`${changed.map(i=>INTRO.stops[i]).join(' · ')} 값 기록`:'기존 도착시각 유지';
 $('basics-ledger').innerHTML=[0,1,2,3].map(k=>{
  const label=`<b>${k}번 이하</b><span> · 라운드 ${k}</span>`;
  if(k>=r.rounds.length&&finished)return `<tr><th scope="row">${label}</th><td colspan="5" class="pending">라운드 ${s.round}에서 종료 · 계산하지 않음</td></tr>`;
  if(k>s.round)return `<tr><th scope="row">${label}</th><td colspan="5" class="pending">아직 계산하지 않은 라운드</td></tr>`;
  const times=k===s.round?s.times:r.rounds[k];
  return `<tr class="${k===s.round?'active-round':''}"><th scope="row">${label}</th>${times.map((t,i)=>`<td class="${k===s.round&&changed.includes(i)?'new-time':''}">${basicsTime(t)}</td>`).join('')}</tr>`;
 }).join('');
 const prev=s.round?r.rounds[s.round-1]:INTRO.stops.map(()=>null);
 $('basics-memory').innerHTML=INTRO.stops.map((name,i)=>`<tr><th scope="row">${name}</th><td class="read-col">${prev[i]===null?'∞':basicsTime(prev[i])}</td><td class="write-col">${s.times[i]===null?'∞':basicsTime(s.times[i])}</td></tr>`).join('');
 $('basics-memory-copy').textContent=s.round===0?'출발 상태를 먼저 채웁니다. 라운드 1은 이 값을 승차 판단에 사용할 것입니다.':s.round===1?'승차 판단에는 라운드 0의 답만 읽습니다. 이번에 D의 값을 채웠더라도 이전 답의 D는 ∞입니다. 이 구분이 한 라운드에서 두 번 타는 경로를 막습니다.':s.round===2?'라운드 1에서 구한 D의 도착시각이 이제 이전 답으로 넘어왔습니다. 이 값으로 2호선에 탈 수 있는지 판단합니다. 이번 답에도 이전 값을 복사해 두므로 한 번 타는 경로를 계속 쓸 수 있습니다.':'라운드 2의 답을 prev와 cur에 복사했습니다. 라운드 3에서는 더 이른 도착시각을 찾지 못하므로 두 배열이 끝까지 같습니다. 새로 개선된 정류장이 없어 탐색을 종료합니다.';
 $('basics-finish').hidden=!finished;
 $('basics-result').textContent=basicsRun===0?'E까지 25분 = 차내 20분 + 도보 1분 50초 + 대기 3분 10초입니다. 라운드 3에서 개선 0개를 확인하고 종료했습니다. 이번에는 출발만 08:05로 바꾸고, 어느 연결을 놓치는지 확인해 보세요.':'08:05 출발에서는 라운드 2에 개선된 값이 없어 종료하며 라운드 3은 실행하지 않습니다. 첫 차가 바뀌고 환승할 차를 놓치므로, 출발이 늦어진 5분을 답에 더하기만 해서는 안 됩니다.';
 $('basics-experiment').textContent=basicsRun===0?'08:05 출발과 비교하기':'08:00 출발로 되돌리기';
}
function renderBasicsDiagram(s,changed){
 const positions=[[70,95],[270,95],[470,95],[270,235],[470,235]];
 let svg=`<path d="M70 95H470" fill="none" stroke="${basicsStep>=1?'#16886b':'#cadcd5'}" stroke-width="5"/><path d="M270 235H470" fill="none" stroke="${basicsStep>=5?'#8b50b6':'#dfd3e9'}" stroke-width="5"/><path d="M270 110V220" fill="none" stroke="${basicsStep===3?'#d66d30':'#94a6a0'}" stroke-width="3" stroke-dasharray="6 5"/><text x="70" y="35" font-size="14" fill="#16886b" font-weight="700">1호선 →</text><text x="360" y="205" font-size="14" fill="#8b50b6" font-weight="700">2호선 →</text><text x="92" y="190" font-size="13" fill="#71837c">도보 110초 ⇣</text>`;
 positions.forEach(([x,y],i)=>{const known=s.times[i]!==null,newValue=changed.includes(i);svg+=`<circle cx="${x}" cy="${y}" r="19" fill="${newValue?'#ffead6':'white'}" stroke="${newValue?'#d66d30':known?'#16886b':'#a2b1ac'}" stroke-width="${newValue?3:2}"/><text x="${x}" y="${y+6}" text-anchor="middle" font-size="18" font-weight="700" fill="#233e43">${INTRO.stops[i]}</text><text x="${x}" y="${y+(i===3?46:-31)}" text-anchor="middle" font-size="18" font-weight="650" fill="${newValue?'#a44c19':'#36554f'}">${basicsTime(s.times[i])}</text>`;});
 $('basics-svg-content').innerHTML=svg;
}
function renderBasicsTimetable(r){
 const first=r.scenes[1].trip;
 $('basics-timetable').innerHTML=INTRO.patterns.map((p,pi)=>`<div><h4>${p.name}${pi===1?' · 하루 한 편':''}</h4><table><thead><tr><th scope="col">운행</th>${p.stops.map(i=>`<th scope="col">${INTRO.stops[i]}</th>`).join('')}</tr></thead><tbody>${p.departures.map((trip,ti)=>{
  const selected=pi===0?basicsStep>=1&&ti===first:basicsStep>=5&&basicsRun===0;
  const missed=pi===0?basicsStep>=1&&ti<first:basicsStep>=5&&basicsRun===1;
  return `<tr class="${selected?'chosen':missed?'missed':''}"><th scope="row">${ti+1}편</th>${trip.map(t=>`<td>${shortClock(t)}</td>`).join('')}</tr>`;
 }).join('')}</tbody></table></div>`).join('');
 $('basics-timetable-note').textContent='정류장에서 도착·출발 시각은 같습니다. 같은 행은 같은 차량입니다. 승객은 차량 출발시각까지 정류장에 도착해야 합니다.';
}
function setBasicsStep(n){basicsStep=Math.max(0,Math.min(n,INTRO.runs[basicsRun].scenes.length-1));renderBasics();}
function setBasicsRun(n){const finished=basicsStep===INTRO.runs[basicsRun].scenes.length-1;basicsRun=n;basicsAnswer=null;setBasicsStep(finished?INTRO.runs[basicsRun].scenes.length-1:basicsStep);}
$('basics-prev').onclick=()=>setBasicsStep(basicsStep-1);$('basics-next').onclick=()=>setBasicsStep(basicsStep+1);
$('basics-steps').onclick=e=>{const b=e.target.closest('[data-basics-step]');if(b)setBasicsStep(+b.dataset.basicsStep);};
document.querySelectorAll('[data-basics-run]').forEach(b=>b.onclick=()=>setBasicsRun(+b.dataset.basicsRun));
document.querySelectorAll('[data-basics-answer]').forEach(b=>b.onclick=()=>{basicsAnswer=b.dataset.basicsAnswer;renderBasics();});
$('basics-experiment').onclick=()=>setBasicsRun(1-basicsRun);
$('basics-to-lesson').onclick=()=>{changeMode('lesson');$('mode-lesson').focus();};
renderBasics();
</script>
