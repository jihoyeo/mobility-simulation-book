# Jupyter Book 설정
# https://jupyterbook.org/customize/config.html

title: 스마트 교통물류 — 모빌리티 시뮬레이션
author: 여지호 (가천대학교 스마트시티학과)
logo: logo.png

# _toc.yml 에 등록된 파일만 빌드한다.
only_build_toc_files: true

execute:
  execute_notebooks: cache
  timeout: 300
  allow_errors: false
  exclude_patterns:
    # 서버가 있어야 하는 장. 서술 위주라 실행할 것이 없다.
    - "ko/projects/*"

# 책에 포함하지 않는 경로
exclude_patterns:
  - _build
  - solutions
  - simulation_base
  - test
  - tools
  - exercises
  - projects
  - docs
  - README.md
  - .venv
  - .pytest_cache
  - _notebooks
  - "**/.ipynb_checkpoints"

parse:
  myst_enable_extensions:
    - colon_fence
    - dollarmath
    - linkify
    - substitution
    - tasklist
    - attrs_inline
    - deflist

bibtex_bibfiles:
  - references.bib

repository:
  url: https://github.com/jihoyeo/mobility-simulation-book
  path_to_book: ""
  branch: main

html:
  baseurl: https://jihoyeo.github.io/mobility-simulation-book/
  use_issues_button: true
  use_repository_button: true
  extra_css:
    - _static/custom.css

launch_buttons:
  colab_url: https://colab.research.google.com
  notebook_interface: jupyterlab

# LaTeX/PDF 는 비활성. pdflatex 는 한글에서 실패한다.
# PDF 가 필요하면 xelatex + Noto Sans KR 로 별도 설정한다.

sphinx:
  config:
    nb_execution_raise_on_error: true
    nb_merge_streams: true
    nb_execution_cache_path: _build/.jupyter_cache
    language: ko
    html_show_copyright: false
