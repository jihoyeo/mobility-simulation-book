# 대용량 실습 자산 목록.
#
# 저장소에는 15MB 이하의 작은 데이터만 넣습니다. 나머지는 여기 적힌 주소에서
# 처음 쓸 때 내려받아 data/_downloads/ 에 둡니다.
#
#     from smartmob.data import ensure
#     path = ensure("GTFS_Korea_2024.zip")
#
# sha256 은 선택이지만, 적어 두면 내려받은 파일이 손상됐는지 확인합니다.
# 값을 구하는 법:
#     python -c "from smartmob.data.paths import sha256; from pathlib import Path; print(sha256(Path('파일')))"
#
# gdown 은 쓰지 않습니다. 레이트리밋이 있고 체크섬을 확인할 수 없어서,
# 수업 중 30명이 동시에 받으면 실패합니다.

[asset."GTFS_Korea_2024.zip"]
url = "https://huggingface.co/datasets/CAMUS-LAB/GTFS-2024/resolve/main/GTFS_Korea_2024.zip"
description = "전국 GTFS 통합본(2024). 프로젝트 A 에서 대상지를 잘라 낼 때 씁니다."
license = "출처 표기 필요 — 국토교통부 TAGO 기반"

# ---------------------------------------------------------------------------
# 저장소에서 내린 자산
#
# 아래 파일들은 개편 과정에서 참조가 사라져 HEAD 에서 제거했습니다.
# git 히스토리의 커밋 7310509 에 그대로 남아 있으므로 언제든 되살릴 수 있습니다.
#
#     git show 7310509:data/chp2_od_data.parquet > chp2_od_data.parquet
#
# 학기 시작 전에 HuggingFace 데이터셋으로 올린 뒤 아래 항목의 주석을 풀고
# url 과 sha256 을 채웁니다.
#
# chp2_od_data.parquet            57MB  수도권 생활이동 O-D 전체
#                                       → 하남 부분만 data/hanam/od_2024.parquet 으로 남겼습니다
# chp2_HangJeongDong_*.geojson    35MB  행정동 경계
# chp2_tx_data_generated.parquet  23MB  가상 택시 통행 기록
# chp3_exercise_train.parquet     83MB  제주 링크 속도 학습셋
# chp3_exercise_test.parquet     4.6MB  같은 자료의 검증셋
#
# 스마트카드 원자료(data/smartcard/, 54MB)는 부록 A 가 쓰므로 저장소에 남겨 두었습니다.
# 라이선스와 개인정보 검토가 끝나기 전까지 외부 공개 배포는 하지 않습니다.
